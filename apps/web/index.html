<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0b0b0d" />
    <meta name="description" content="HAMMER LINE Shipping & Logistics — نظام إدارة التخليص الجمركي" />
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" type="image/png" href="/favicon-32.png" sizes="32x32" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>HAMMER LINE</title>
    <style>
      /* Instant splash before the app's JavaScript arrives; React replaces it. */
      html, body { margin: 0; }
      /* dark until the app sets the theme; the light theme brings its own background */
      html:not([data-theme='light']) { background: #0b0b0d; }
      #splash { position: fixed; inset: 0; display: grid; place-items: center; }
      #splash img { width: 96px; animation: splash 1.4s ease-in-out infinite alternate; }
      @keyframes splash { from { opacity: .35; transform: scale(.94); } to { opacity: 1; transform: scale(1); } }
      @media (prefers-reduced-motion: reduce) { #splash img { animation: none; } }
    </style>
  </head>
  <body>
    <div id="root"><div id="splash"><img src="/logo-mark.png" alt="HAMMER LINE" /></div></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
